name: Update Changelog

# main is protected, so the changelog is updated inside each pull request.
# Add a repository secret CHANGELOG_PAT (fine-grained token, Contents: read/write
# on this repo). Commits pushed with GITHUB_TOKEN do not trigger the required CI
# checks, which would leave the PR unmergeable.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: changelog-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changelog:
    name: Update CHANGELOG.md
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.CHANGELOG_PAT || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate changelog
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_DATE: ${{ github.event.pull_request.created_at }}
        run: |
          export PR_DATE="${PR_DATE%%T*}"
          node scripts/generate-changelog.js

      - name: Commit changelog
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "No changelog changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore: update changelog"
          git push
